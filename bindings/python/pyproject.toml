[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openkind-client"
version = "0.1.0"
description = "Python HTTP client for the openkind System One API"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools]
packages = ["openkind_client"]

[tool.setuptools.package-data]
openkind_client = ["py.typed"]
