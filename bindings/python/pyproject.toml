[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openkind-client"
version = "0.1.0"
description = "Python HTTP client for the openkind System One API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools]
packages = ["openkind_client"]

[tool.setuptools.package-data]
openkind_client = ["py.typed"]
