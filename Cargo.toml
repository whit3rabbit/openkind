[workspace]
resolver = "2"
members = [
    "crates/opendecision-core",
    "crates/opendecision-api",
    "crates/opendecision-server",
    "crates/opendecision-engine",
    "crates/opendecision-runtime",
    "crates/opendecision-backends",
    "crates/opendecision-cli",
    "crates/opendecision-client",
    "crates/opendecision-gen-schemas",
    "proto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/whit3rabbit/opendecision"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Errors
thiserror = "2"
anyhow = "1"

# Async
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "net", "time", "fs"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"

# HTTP
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "limit", "timeout"] }
hyper = { version = "1", features = ["full"] }

# gRPC
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"

# CLI / config
clap = { version = "4", features = ["derive", "env"] }
config = "0.15"
humantime = "2"
humantime-serde = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# Crypto / TLS
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "aws_lc_rs", "tls12"] }
rustls-pki-types = "1"
jsonwebtoken = "11"
sha2 = "0.10"

# Model artifacts. safetensors 0.5.3 is the newest release in this line
# compatible with the workspace's declared Rust 1.75 minimum.
safetensors = "=0.5.3"

# Internal
opendecision-core = { path = "crates/opendecision-core" }
opendecision-api = { path = "crates/opendecision-api" }
opendecision-engine = { path = "crates/opendecision-engine" }
opendecision-runtime = { path = "crates/opendecision-runtime" }
opendecision-backends = { path = "crates/opendecision-backends" }
opendecision-proto = { path = "proto" }

# Client
fastrand = "2"

# Phase 3 native-backend candidates. These remain unused until backbone parity.
candle-core = "0.8"
candle-nn = "0.8"
dashmap = "6"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
