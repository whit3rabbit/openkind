[workspace]
resolver = "2"
members = [
    "crates/openkind-core",
    "crates/openkind-api",
    "crates/openkind-server",
    "crates/openkind-engine",
    "crates/openkind-runtime",
    "crates/openkind-backends",
    "crates/openkind-cli",
    "crates/openkind-client",
    "crates/openkind-gen-schemas",
    "crates/openkind-bench",
    "crates/openkind-model-store",
    "crates/openkind-datasets",
    "proto",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
# The locked dependency set requires Rust 1.90 (ordered-float 5.5.0).
rust-version = "1.90"
license = "MIT"
license-file = "LICENSE"
repository = "https://github.com/whit3rabbit/openkind"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5"
schemars = "1"
# Fast non-cryptographic hasher for wire-map keys (question/answer ids).
foldhash = "0.1"
smallvec = "1"

# Errors
thiserror = "2"
anyhow = "1"

# Async
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "net", "time", "fs"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"

# HTTP
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "limit", "timeout"] }
hyper = { version = "1", features = ["full"] }

# gRPC
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"

# CLI / config
clap = { version = "4", features = ["derive", "env"] }
config = "0.15"
humantime = "2"
humantime-serde = "1"

# Development benchmarking. Pin the patch release so future Criterion MSRV
# changes cannot silently move the workspace above Rust 1.90.
criterion = { version = "=0.8.2", features = ["async_tokio", "html_reports"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# Pin the unofficial bulk endpoint dependencies to the qualified Arrow release.
arrow-array = "=60.0.0"
arrow-ipc = { version = "=60.0.0", default-features = false }
arrow-schema = "=60.0.0"
# Evaluation-dataset shards are read from pinned parquet files; keep the same
# qualified Arrow release line.
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "snap"] }

# Crypto / TLS
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "aws_lc_rs", "tls12"] }
rustls-pki-types = "1"
jsonwebtoken = "11"
sha2 = "0.10"

# Model artifacts are pinned for reproducible profile/runtime behavior.
safetensors = "=0.5.3"
# Keep tokenizer execution offline and pinned to the regex behavior used by the
# export. Cargo.lock pins the remaining transitive runtime dependencies.
tokenizers = { version = "=0.20.4", default-features = false, features = ["onig"] }

# Internal
openkind-core = { path = "crates/openkind-core", version = "0.2.0" }
openkind-client = { path = "crates/openkind-client", version = "0.2.0" }
openkind-api = { path = "crates/openkind-api", version = "0.2.0" }
openkind-engine = { path = "crates/openkind-engine", version = "0.2.0" }
openkind-runtime = { path = "crates/openkind-runtime", version = "0.2.0" }
openkind-backends = { path = "crates/openkind-backends", version = "0.2.0" }
openkind-model-store = { path = "crates/openkind-model-store", version = "0.2.0" }
openkind-datasets = { path = "crates/openkind-datasets", version = "0.2.0" }
openkind-proto = { path = "proto", version = "0.2.0" }

# Client
fastrand = "2"

# Phase 3 correctness-first native CPU backbone. The optional `cuda` feature
# of openkind-backends forwards to these crates' own `cuda` features; the CUDA
# toolchain (nvcc) is required to build with it and no workspace default
# enables it.
candle-core = "=0.8.0"
candle-nn = "=0.8.0"
# Surveyed-family model implementations (BERT, DistilBERT, Qwen2, quantized
# GGUF runners). Pinned to the same candle release line as candle-core.
candle-transformers = "=0.8.0"

# Phase 3N CUDA/ONNX block. `ort` executes ONNX artifacts through ONNX
# Runtime; `load-dynamic` keeps builds offline (no binary downloads at build
# time) and defers the library to explicit operator setup, mirroring the MLX
# runtime discipline. The `cuda` feature on `ort` only gates the CUDA
# execution-provider registration code path.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }

# Accelerator discovery. `nvml-wrapper` resolves `libnvidia-ml` with dlopen at
# runtime, so detection stays functional (and harmless) on hosts without
# NVIDIA drivers.
nvml-wrapper = "0.11"

# Phase 3M MLX/Metal parity backend (optional, macOS arm64 only). The versions
# track Apple's MLX release line; the exact pins keep the vendored mlx-c build
# and the Rust API surface reproducible. mlx-sys 0.6.0 vendors mlx-c
# v0.6.0-7-gc74db53 (MLX core 0.32.2); `half` mirrors mlx-rs's bfloat16 type.
mlx-rs = "=0.32.0"
mlx-sys = "=0.6.0"
half = "2"
dashmap = "6"
parking_lot = "0.12"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
