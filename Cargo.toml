[workspace]
resolver = "2"
members = [
    "crates/openkind-core",
    "crates/openkind-api",
    "crates/openkind-server",
    "crates/openkind-engine",
    "crates/openkind-runtime",
    "crates/openkind-backends",
    "crates/openkind-cli",
    "crates/openkind-client",
    "crates/openkind-gen-schemas",
    "crates/openkind-bench",
    "crates/openkind-model-store",
    "proto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Raised from 1.75 for the optional Phase 3M MLX/Metal backend: mlx-rs 0.32.0
# (pinned in the Phase 3M dependency block below) requires 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/whit3rabbit/openkind"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5"
schemars = "1"
# Fast non-cryptographic hasher for wire-map keys (question/answer ids).
foldhash = "0.1"
smallvec = "1"

# Errors
thiserror = "2"
anyhow = "1"

# Async
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "net", "time", "fs"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"

# HTTP
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "limit", "timeout"] }
hyper = { version = "1", features = ["full"] }

# gRPC
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"

# CLI / config
clap = { version = "4", features = ["derive", "env"] }
config = "0.15"
humantime = "2"
humantime-serde = "1"

# Development benchmarking. Pin the patch release so future Criterion MSRV
# changes cannot silently move the workspace above Rust 1.88.
criterion = { version = "=0.8.2", features = ["async_tokio", "html_reports"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# Crypto / TLS
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "aws_lc_rs", "tls12"] }
rustls-pki-types = "1"
jsonwebtoken = "11"
sha2 = "0.10"

# Model artifacts are pinned for reproducible profile/runtime behavior.
safetensors = "=0.5.3"
# Keep tokenizer execution offline and pinned to the regex behavior used by the
# export. Cargo.lock pins the remaining transitive runtime dependencies.
tokenizers = { version = "=0.20.4", default-features = false, features = ["onig"] }

# Internal
openkind-core = { path = "crates/openkind-core", version = "0.1.0" }
openkind-api = { path = "crates/openkind-api", version = "0.1.0" }
openkind-engine = { path = "crates/openkind-engine", version = "0.1.0" }
openkind-runtime = { path = "crates/openkind-runtime", version = "0.1.0" }
openkind-backends = { path = "crates/openkind-backends", version = "0.1.0" }
openkind-model-store = { path = "crates/openkind-model-store", version = "0.1.0" }
openkind-proto = { path = "proto", version = "0.1.0" }

# Client
fastrand = "2"

# Phase 3 correctness-first native CPU backbone.
candle-core = "=0.8.0"
candle-nn = "=0.8.0"
# Surveyed-family model implementations (BERT, DistilBERT, Qwen2, quantized
# GGUF runners). Pinned to the same candle release line as candle-core.
candle-transformers = "=0.8.0"

# Phase 3M MLX/Metal parity backend (optional, macOS arm64 only). The versions
# track Apple's MLX release line; the exact pins keep the vendored mlx-c build
# and the Rust API surface reproducible. mlx-sys 0.6.0 vendors mlx-c
# v0.6.0-7-gc74db53 (MLX core 0.32.2); `half` mirrors mlx-rs's bfloat16 type.
mlx-rs = "=0.32.0"
mlx-sys = "=0.6.0"
half = "2"
dashmap = "6"
parking_lot = "0.12"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
