[workspace]
resolver = "2"
members = [
    "crates/openpick-core",
    "crates/openpick-api",
    "crates/openpick-server",
    "crates/openpick-engine",
    "crates/openpick-runtime",
    "crates/openpick-backends",
    "crates/openpick-cli",
    "crates/openpick-gen-schemas",
    "proto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/whit3rabbit/openpick"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Errors
thiserror = "2"
anyhow = "1"

# Async
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "net", "time", "fs"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"

# HTTP
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "limit", "timeout"] }
hyper = { version = "1", features = ["full"] }

# gRPC
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"

# CLI / config
clap = { version = "4", features = ["derive", "env"] }
config = "0.15"
humantime = "2"
humantime-serde = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# Crypto / TLS
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "aws_lc_rs", "tls12"] }
rustls-pki-types = "1"
jsonwebtoken = "11"

# Internal
openpick-core = { path = "crates/openpick-core" }
openpick-api = { path = "crates/openpick-api" }
openpick-engine = { path = "crates/openpick-engine" }
openpick-runtime = { path = "crates/openpick-runtime" }
openpick-backends = { path = "crates/openpick-backends" }
openpick-proto = { path = "proto" }

# Phase 2 — declared so workspace deps resolve, but unused until then
candle-core = "0.8"
candle-nn = "0.8"
dashmap = "6"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"