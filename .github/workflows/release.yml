name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  resolve-release:
    name: resolve release revision
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Validate release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
            if [[ ! "${tag}" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
              echo "invalid release tag: ${tag}" >&2
              exit 1
            fi
            ref="refs/tags/${tag}"
          else
            tag="${EVENT_TAG}"
            ref="${EVENT_REF}"
            if [[ "${ref}" != "refs/tags/${tag}" ]]; then
              echo "release workflow must be triggered by a tag" >&2
              exit 1
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && steps.release.outputs.ref || github.sha }}

      - name: Record immutable release revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-crates:
    name: publish to crates.io
    needs: [resolve-release]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish workspace crates to crates.io
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true
          check-repo: false

  build-binaries:
    name: build ${{ matrix.target }}
    needs: [resolve-release]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} --bin openkind --bin openkindd

      - name: Package archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          ver="${tag#v}"
          name="openkind-${ver}-${{ matrix.target }}"
          bin_dir="target/${{ matrix.target }}/release"

          # Windows archives are zips holding the .exe binaries; every other
          # target ships a tarball.
          if [[ "${{ matrix.target }}" == x86_64-pc-windows-msvc ]]; then
            powershell -NoProfile -Command \
              "Compress-Archive -Path '${bin_dir}/openkind.exe','${bin_dir}/openkindd.exe' -DestinationPath '${name}.zip' -Force"
            asset="${name}.zip"
          else
            tar -C "$bin_dir" -czf "${name}.tar.gz" openkind openkindd
            asset="${name}.tar.gz"
          fi
          checksum="${asset}.sha256"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${asset}" > "${checksum}"
          else
            shasum -a 256 "${asset}" > "${checksum}"
          fi

          {
            echo "RELEASE_TAG=${tag}"
            echo "ASSET=${asset}"
            echo "CHECKSUM=${checksum}"
          } >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.ASSET }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}

      - name: Upload artifact for tap update
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}

  homebrew-tap:
    name: update homebrew tap
    needs: [resolve-release, build-binaries]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
    steps:
      - name: Checkout openkind templates
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Render formula from release checksums
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          ver="${tag#v}"
          mkdir -p out

          tgz_arm="openkind-${ver}-aarch64-apple-darwin.tar.gz"
          tgz_intel="openkind-${ver}-x86_64-apple-darwin.tar.gz"
          tgz_linux="openkind-${ver}-x86_64-unknown-linux-musl.tar.gz"

          sha_arm=$(sha256sum "artifacts/${tgz_arm}" | cut -d' ' -f1)
          sha_intel=$(sha256sum "artifacts/${tgz_intel}" | cut -d' ' -f1)
          sha_linux=$(sha256sum "artifacts/${tgz_linux}" | cut -d' ' -f1)

          sed -e "s/@@VERSION@@/${ver}/g" \
              -e "s/@@SHA_ARM_TGZ@@/${sha_arm}/g" \
              -e "s/@@SHA_INTEL_TGZ@@/${sha_intel}/g" \
              -e "s/@@SHA_LINUX_TGZ@@/${sha_linux}/g" \
              packaging/homebrew/openkind.rb > out/openkind.rb

          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Checkout whit3rabbit/homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: whit3rabbit/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit and push formula to homebrew-tap
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp out/openkind.rb tap/Formula/openkind.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/openkind.rb
          git commit -m "openkind ${TAG}" || { echo "no changes to formula"; exit 0; }
          git push
