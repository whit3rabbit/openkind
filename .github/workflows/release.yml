name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: openkind-release
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  resolve-release:
    name: resolve release revision
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.revision.outputs.sha }}
      prerelease: ${{ steps.revision.outputs.prerelease }}
    steps:
      - name: Validate release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG}"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then tag="${INPUT_TAG}"; fi
          # Bound the checkout ref here; the shared publisher validates strict SemVer below.
          if [[ ! "${tag}" =~ ^v[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
            echo "invalid release tag: ${tag}" >&2
            exit 1
          fi
          ref="refs/tags/${tag}"
          if [[ "${EVENT_NAME}" != "workflow_dispatch" && "${EVENT_REF}" != "${ref}" ]]; then
            echo "release workflow must be triggered by a tag" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && steps.release.outputs.ref || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate release version and licenses without upload
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p dist
          python3 scripts/publish-crates.py plan --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)" \
            --output dist/crate-versions.json 2>&1 | tee dist/preflight.log

      - name: Retain the preflight plan and failure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: release-preflight
          path: dist/*
          if-no-files-found: warn

      - name: Record immutable release revision
        id: revision
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version="${RELEASE_TAG#v}"
          core_and_prerelease="${version%%+*}"
          if [[ "$core_and_prerelease" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: verify release revision
    needs: [resolve-release]
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.resolve-release.outputs.sha }}

  publish-crates:
    name: publish to crates.io
    needs: [resolve-release, verify, build-binaries]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
          fetch-depth: 0

      - name: Install release Cargo
        uses: dtolnay/rust-toolchain@1.98.1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '32.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: release-preflight
          path: target/release-preflight

      - name: Restore publication ledger when rerunning this release
        if: github.run_attempt > 1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: dist

      - name: Publish verified crate versions serially
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_SHA: ${{ needs.resolve-release.outputs.sha }}
        run: |
          mkdir -p dist
          cp target/release-preflight/crate-versions.json dist/crate-versions.json
          python3 scripts/publish-crates.py publish --tag "$RELEASE_TAG" --commit "$RELEASE_SHA" \
            --report dist/crate-publish-report.json 2>&1 | tee target/release-preflight/publish.log

      - name: Retain version metadata and resumable publication report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: release-metadata
          path: dist/*.json
          if-no-files-found: warn

      - name: Retain publication logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: release-publish-logs
          path: target/release-preflight/*.log
          if-no-files-found: warn

  build-binaries:
    needs: [resolve-release]
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      revision: ${{ needs.resolve-release.outputs.sha }}
      version: ${{ needs.resolve-release.outputs.tag }}
      attest: true

  publish-assets:
    name: publish verified archives
    needs: [resolve-release, build-binaries, publish-crates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: openkind-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          prerelease: ${{ needs.resolve-release.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: dist/*

  homebrew-tap:
    name: update homebrew tap
    if: needs.resolve-release.outputs.prerelease == 'false'
    needs: [resolve-release, build-binaries, publish-assets]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
    steps:
      - name: Checkout openkind templates
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: openkind-*
          path: artifacts
          merge-multiple: true

      - name: Render formula from release checksums
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          ver="${tag#v}"
          mkdir -p out

          tgz_arm="openkind-${ver}-aarch64-apple-darwin.tar.gz"
          tgz_intel="openkind-${ver}-x86_64-apple-darwin.tar.gz"
          tgz_linux="openkind-${ver}-x86_64-unknown-linux-gnu.tar.gz"

          sha_arm=$(sha256sum "artifacts/${tgz_arm}" | cut -d' ' -f1)
          sha_intel=$(sha256sum "artifacts/${tgz_intel}" | cut -d' ' -f1)
          sha_linux=$(sha256sum "artifacts/${tgz_linux}" | cut -d' ' -f1)

          sed -e "s/@@VERSION@@/${ver}/g" \
              -e "s/@@SHA_ARM_TGZ@@/${sha_arm}/g" \
              -e "s/@@SHA_INTEL_TGZ@@/${sha_intel}/g" \
              -e "s/@@SHA_LINUX_TGZ@@/${sha_linux}/g" \
              packaging/homebrew/openkind.rb > out/openkind.rb

          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Checkout whit3rabbit/homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: whit3rabbit/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit and push formula to homebrew-tap
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp out/openkind.rb tap/Formula/openkind.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/openkind.rb
          git commit -m "openkind ${TAG}" || { echo "no changes to formula"; exit 0; }
          git push
