name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  resolve-release:
    name: resolve release revision
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Validate release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
            if [[ ! "${tag}" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
              echo "invalid release tag: ${tag}" >&2
              exit 1
            fi
            ref="refs/tags/${tag}"
          else
            tag="${EVENT_TAG}"
            ref="${EVENT_REF}"
            if [[ "${ref}" != "refs/tags/${tag}" ]]; then
              echo "release workflow must be triggered by a tag" >&2
              exit 1
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && steps.release.outputs.ref || github.sha }}

      - name: Record immutable release revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-crates:
    name: publish to crates.io
    needs: [resolve-release]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish workspace crates to crates.io
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true
          check-repo: false

  build-binaries:
    needs: [resolve-release]
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      revision: ${{ needs.resolve-release.outputs.sha }}
      version: ${{ needs.resolve-release.outputs.tag }}
      attest: true

  publish-assets:
    name: publish verified archives
    needs: [resolve-release, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: openkind-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          files: dist/*

  homebrew-tap:
    name: update homebrew tap
    needs: [resolve-release, build-binaries, publish-assets]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
    steps:
      - name: Checkout openkind templates
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Render formula from release checksums
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          ver="${tag#v}"
          mkdir -p out

          tgz_arm="openkind-${ver}-aarch64-apple-darwin.tar.gz"
          tgz_intel="openkind-${ver}-x86_64-apple-darwin.tar.gz"
          tgz_linux="openkind-${ver}-x86_64-unknown-linux-gnu.tar.gz"

          sha_arm=$(sha256sum "artifacts/${tgz_arm}" | cut -d' ' -f1)
          sha_intel=$(sha256sum "artifacts/${tgz_intel}" | cut -d' ' -f1)
          sha_linux=$(sha256sum "artifacts/${tgz_linux}" | cut -d' ' -f1)

          sed -e "s/@@VERSION@@/${ver}/g" \
              -e "s/@@SHA_ARM_TGZ@@/${sha_arm}/g" \
              -e "s/@@SHA_INTEL_TGZ@@/${sha_intel}/g" \
              -e "s/@@SHA_LINUX_TGZ@@/${sha_linux}/g" \
              packaging/homebrew/openkind.rb > out/openkind.rb

          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Checkout whit3rabbit/homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: whit3rabbit/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit and push formula to homebrew-tap
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp out/openkind.rb tap/Formula/openkind.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/openkind.rb
          git commit -m "openkind ${TAG}" || { echo "no changes to formula"; exit 0; }
          git push
