name: backend packaging CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*release*.yml'
      - '.github/workflows/ci.yml'
      - 'packaging/**'
      - 'scripts/release.py'
      - 'scripts/tests/test_release.py'
      - 'scripts/publish-crates.py'
      - 'scripts/tests/test_publish_crates.py'
      - 'Cargo.*'
      - 'crates/**'
      - 'proto/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  archives:
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
      version: ci
