name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: fmt, clippy, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: env -u RUST_LOG cargo test --workspace

      - name: Smoke-test Criterion benchmarks
        run: env -u RUST_LOG cargo test --workspace --benches --locked

  msrv:
    name: MSRV Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install workspace MSRV
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Run locked all-features workspace tests
        run: env -u RUST_LOG cargo test --workspace --all-features --locked

      - name: Smoke-test Criterion benchmarks on MSRV
        run: env -u RUST_LOG cargo test --workspace --all-features --benches --locked
