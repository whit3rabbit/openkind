name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: fmt, clippy, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '32.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: env -u RUST_LOG cargo test --workspace

      - name: Check offline qualification tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_qwen_qualification.py'

      - name: Smoke-test Criterion benchmarks
        run: env -u RUST_LOG cargo test --workspace --benches --locked

  platforms:
    name: clippy and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '32.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        shell: bash
        run: env -u RUST_LOG cargo test --workspace

  msrv:
    name: MSRV Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install workspace MSRV
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '32.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # CUDA and MLX require their qualified hardware/toolchains; this runner tests CPU.
      - name: Run locked CPU workspace tests
        run: env -u RUST_LOG cargo test --workspace --locked

      - name: Check optional ONNX CPU features on MSRV
        run: cargo check --workspace --all-targets --features onnx --locked

      - name: Smoke-test Criterion benchmarks on MSRV
        run: env -u RUST_LOG cargo test --workspace --benches --locked

  swift:
    name: Swift package (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Swift package manifest
        run: swift package dump-package

      - name: Build and test Swift package
        run: swift test
