name: backend release artifacts

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      version:
        type: string
        required: true
      attest:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  build:
    name: build ${{ matrix.target }} ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, variant: standard, features: mlx }
          - { os: macos-15, target: aarch64-apple-darwin, variant: onnx, features: 'mlx,onnx' }
          - { os: macos-15-intel, target: x86_64-apple-darwin, variant: standard, features: '' }
          - { os: macos-15-intel, target: x86_64-apple-darwin, variant: onnx, features: onnx }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, variant: standard, features: cuda }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, variant: onnx, features: 'cuda,onnx-cuda' }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, variant: standard, features: cuda }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, variant: onnx, features: 'cuda,onnx-cuda' }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl, variant: standard, features: '' }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: arduino/setup-protoc@v3
        with:
          version: '32.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record build environment and available disk
        shell: bash
        run: |
          mkdir -p target/release-reports
          rustc -Vv | tee target/release-reports/rustc.txt
          df -h | tee target/release-reports/disk-before.txt
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install CUDA-compatible MSVC toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $installer = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/setup.exe"
          $process = Start-Process $installer -ArgumentList @('modify', '--installPath', "`"$installation`"", '--add', 'Microsoft.VisualStudio.Component.VC.14.39.17.9.x86.x64', '--quiet', '--norestart') -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "MSVC installation failed: $($process.ExitCode)" }
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.39'
      - name: Install minimal Linux CUDA compiler without drivers
        if: runner.os == 'Linux' && contains(matrix.features, 'cuda')
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.6.0'
          method: network
          sub-packages: '["nvcc"]'
          non-cuda-sub-packages: '[]'
          use-github-cache: false
          use-local-cache: false
      - name: Release Linux installer space and record resolved CUDA versions
        if: runner.os == 'Linux' && contains(matrix.features, 'cuda')
        shell: bash
        run: |
          sudo apt-get clean
          rm -f cuda_keyring.deb
          nvcc --version | tee target/release-reports/nvcc.txt
          dpkg-query -W 'cuda-*-12-6' | tee target/release-reports/cuda-packages.txt
          df -h | tee target/release-reports/disk-after-cuda.txt
      - name: Install Windows CUDA toolkit without drivers
        if: runner.os == 'Windows' && contains(matrix.features, 'cuda')
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.6.0'
          method: local
          sub-packages: '["nvcc","cudart","nvrtc","nvrtc_dev","cublas","cublas_dev","curand","curand_dev"]'
          use-github-cache: false
          use-local-cache: false
          log-file-suffix: '${{ matrix.target }}-${{ matrix.variant }}.txt'
      - name: Prepare release-only Candle manifest override
        if: contains(matrix.features, 'cuda')
        run: python scripts/release.py prepare-cuda
      - name: Build Unix release configurations
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
          CUDA_COMPUTE_CAP: '80'
        run: |
          set -euo pipefail
          if [[ "$TARGET" == aarch64-apple-darwin ]]; then
            SDKROOT=$(xcrun --show-sdk-path)
            export SDKROOT
            export MLX_RS_METAL_PATH="$PWD/target/release-metallib"
          fi
          build=(cargo build)
          check=(cargo check)
          clippy=(cargo clippy)
          if [[ "$FEATURES" == *cuda* ]]; then
            build+=(--config target/release-cargo-config.toml)
            check+=(--config target/release-cargo-config.toml)
            clippy+=(--config target/release-cargo-config.toml)
          fi
          "${build[@]}" --release --locked --target "$TARGET" --features "$FEATURES" --bin openkind --bin openkindd \
            2>&1 | tee target/release-reports/build.log
          if [[ "$TARGET" == aarch64-apple-darwin ]]; then
            cp target/release-metallib/mlx.metallib "target/$TARGET/release/"
          fi
          "${check[@]}" -p openkind-server --all-targets --locked --target "$TARGET" --features "$FEATURES" \
            2>&1 | tee target/release-reports/check.log
          if [[ "$FEATURES" == *cuda* ]]; then
            "${clippy[@]}" -p openkind-backends --all-targets --locked --target "$TARGET" --features "$FEATURES" -- -D warnings \
              2>&1 | tee target/release-reports/clippy.log
          fi
      - name: Build Windows release configurations with the MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
          CUDA_COMPUTE_CAP: '80'
        run: |
          $linker = (Get-Command link.exe).Source
          if ($linker -notmatch 'VC[\\/]Tools[\\/]MSVC') { throw "MSVC linker was not selected: $linker" }
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = $linker
          $linker | Set-Content target/release-reports/linker.txt
          nvcc --version | Tee-Object target/release-reports/nvcc.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --config target/release-cargo-config.toml --release --locked --target $env:TARGET --features $env:FEATURES --bin openkind --bin openkindd 2>&1 | Tee-Object target/release-reports/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --config target/release-cargo-config.toml -p openkind-server --all-targets --locked --target $env:TARGET --features $env:FEATURES 2>&1 | Tee-Object target/release-reports/check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --config target/release-cargo-config.toml -p openkind-backends --all-targets --locked --target $env:TARGET --features $env:FEATURES -- -D warnings 2>&1 | Tee-Object target/release-reports/clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package pinned runtime, notices, and checksums
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          command=(python scripts/release.py package --bin-dir "target/$TARGET/release" --target "$TARGET" --version "$VERSION")
          if [[ "$VARIANT" == onnx ]]; then command+=(--onnx); fi
          "${command[@]}" 2>&1 | tee target/release-reports/package.log
      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: openkind-${{ matrix.target }}-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error
      - name: Retain build reports on success or failure
        uses: actions/upload-artifact@v7
        if: always()
        with:
          overwrite: true
          name: release-build-reports-${{ matrix.target }}-${{ matrix.variant }}
          path: target/release-reports/*
          if-no-files-found: warn
      - name: Record remaining disk
        if: always()
        shell: bash
        run: df -h

  smoke:
    name: clean host ${{ matrix.target }} ${{ matrix.variant }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, variant: standard, features: mlx-fp32 }
          - { os: macos-15, target: aarch64-apple-darwin, variant: onnx, features: 'mlx-fp32,onnx' }
          - { os: macos-15-intel, target: x86_64-apple-darwin, variant: standard, features: '' }
          - { os: macos-15-intel, target: x86_64-apple-darwin, variant: onnx, features: onnx }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, variant: standard, features: cuda }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, variant: onnx, features: 'cuda,onnx,onnx-cuda' }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, variant: standard, features: cuda }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, variant: onnx, features: 'cuda,onnx,onnx-cuda' }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl, variant: standard, features: '' }
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Initialize dependency audit tool
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/download-artifact@v8
        with:
          name: openkind-${{ matrix.target }}-${{ matrix.variant }}
          path: dist
      - name: Verify relocated archive on a fresh runner without CUDA or cuDNN
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          mkdir -p target/release-reports
          for archive in dist/*.tar.gz dist/*.zip; do
            [[ -f "$archive" ]] || continue
            python scripts/release.py smoke "$archive" --features "$FEATURES" \
              2>&1 | tee -a target/release-reports/smoke.log
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          overwrite: true
          name: release-smoke-reports-${{ matrix.target }}-${{ matrix.variant }}
          path: target/release-reports/*
          if-no-files-found: warn
      - name: Attest verified archive
        if: inputs.attest
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  homebrew:
    name: Homebrew ${{ matrix.target }}
    needs: [build, smoke]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: Homebrew/actions/setup-homebrew@master
      - uses: actions/download-artifact@v8
        with:
          name: openkind-${{ matrix.target }}-standard
          path: dist
      - name: Install and test the rendered formula
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -euo pipefail
          mkdir -p target/release-reports
          for archive in dist/*.tar.gz; do
            python scripts/release.py homebrew "$archive" \
              2>&1 | tee -a target/release-reports/homebrew.log
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          overwrite: true
          name: release-homebrew-reports-${{ matrix.target }}
          path: target/release-reports/*
          if-no-files-found: warn
