[package]
name = "opendecision-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Phase 1: opendecisiond — the daemon combining HTTP, gRPC, config, tracing, and graceful shutdown."

[dependencies]
opendecision-core = { workspace = true }
opendecision-engine = { workspace = true }
opendecision-api = { workspace = true }
opendecision-backends = { workspace = true }
opendecision-runtime = { workspace = true }
axum = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
humantime-serde = { workspace = true }

[[bin]]
name = "opendecisiond"
path = "src/main.rs"
