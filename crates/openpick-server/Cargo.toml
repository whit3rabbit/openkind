[package]
name = "openpick-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Phase 1: openpickd — the daemon combining HTTP, gRPC, config, tracing, and graceful shutdown."

[dependencies]
openpick-core = { workspace = true }
openpick-engine = { workspace = true }
openpick-api = { workspace = true }
axum = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
humantime-serde = { workspace = true }

[[bin]]
name = "openpickd"
path = "src/main.rs"