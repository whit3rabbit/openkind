openapi: 3.1.0
info:
  title: openpick API
  version: 0.1.0
  description: |
    Open-source, high-throughput decision-inference engine speaking the Jev protocol.
    Wire- and SDK-compatible with TypeSafe's hosted API (`https://api.typesafe.ai`).
    Supports dual transports: HTTP/REST and gRPC (`openpick.SystemOne`).
  license:
    name: Apache-2.0 OR MIT
  contact:
    name: openpick maintainers
    url: https://github.com/whit3rabbit/openpick

servers:
  - url: http://127.0.0.1:18080
    description: Default local openpickd daemon
  - url: https://api.typesafe.ai
    description: TypeSafe hosted API

security:
  - []
  - BearerAuth: []

paths:
  /v1/systemone:
    post:
      summary: Evaluate System 1 questions (canonical)
      description: |
        Primary decision-inference endpoint. Evaluates one or more typed questions
        (`noul`, `choice`, `score`) against a supplied `state` context.
      operationId: evaluateSystemOne
      tags:
        - Evaluation
      parameters:
        - $ref: '#/components/parameters/InboundRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRequest'
            examples:
              quickstart:
                summary: Minimal Noul evaluation
                value:
                  state: "I was charged twice for order #1042."
                  model: "mock"
                  questions:
                    billing:
                      type: "noul"
                      instructions: "Is this inquiry related to a billing issue?"
              mixed:
                summary: Multi-question evaluation
                value:
                  state: "Customer support transcript: Agent resolved issue in 4 minutes."
                  model: "mock"
                  questions:
                    is_resolved:
                      type: "noul"
                      instructions: "Was the issue resolved?"
                    satisfaction:
                      type: "score"
                      instructions: "Rate customer satisfaction"
                      criteria:
                        - "Dissatisfied"
                        - "Neutral"
                        - "Delighted"
      responses:
        '200':
          description: Evaluation completed successfully.
          headers:
            x-typesafe-request-id:
              $ref: '#/components/headers/XTypesafeRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '529':
          $ref: '#/components/responses/Overloaded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/system_one:
    post:
      summary: Evaluate System 1 questions (SDK alias)
      description: |
        Alias for `/v1/systemone` providing exact path parity for clients calling `/v1/system_one`.
      operationId: evaluateSystemOneAlias
      tags:
        - Evaluation
      parameters:
        - $ref: '#/components/parameters/InboundRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRequest'
      responses:
        '200':
          description: Evaluation completed successfully.
          headers:
            x-typesafe-request-id:
              $ref: '#/components/headers/XTypesafeRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '529':
          $ref: '#/components/responses/Overloaded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/models:
    get:
      summary: List registered model backends
      description: |
        Returns the catalog of registered decision engines and aliases sorted alphabetically by name.
      operationId: listModels
      tags:
        - Models
      parameters:
        - $ref: '#/components/parameters/InboundRequestId'
      responses:
        '200':
          description: List of models returned successfully.
          headers:
            x-typesafe-request-id:
              $ref: '#/components/headers/XTypesafeRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health:
    get:
      summary: Health check liveness probe
      description: |
        Always open probe endpoint for container orchestrators and load balancers.
        Never gated by bearer authorization.
      operationId: healthCheck
      security: []
      tags:
        - System
      responses:
        '200':
          description: Server is healthy.
          headers:
            x-typesafe-request-id:
              $ref: '#/components/headers/XTypesafeRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: "ok"

  /metrics:
    get:
      summary: Prometheus metrics endpoint
      description: |
        Prometheus text exposition format (version 0.0.4) metrics exporter.
        Always open; never gated by bearer authorization.
      operationId: getMetrics
      security: []
      tags:
        - System
      responses:
        '200':
          description: Prometheus metrics output.
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: |
        Opt-in bearer token authentication configured via `OPENPICK_API_KEY`
        or `TYPESAFE_API_KEY`. When disabled (default), `/v1/*` routes are open.

  parameters:
    InboundRequestId:
      name: x-typesafe-request-id
      in: header
      required: false
      description: Optional client-supplied UUIDv4 request identifier for distributed tracing.
      schema:
        type: string
        format: uuid

  headers:
    XTypesafeRequestId:
      description: UUIDv4 identifying this evaluation request. Matches `result.request_id` in Python SDK.
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: Suggested delay before retrying in integer seconds.
      schema:
        type: integer
    RetryAfterMs:
      description: Suggested delay before retrying in milliseconds.
      schema:
        type: integer
    WWWAuthenticate:
      description: Authentication challenge header emitted on 401 Unauthorized.
      schema:
        type: string
        example: "Bearer"

  responses:
    BadRequest:
      description: Malformed JSON syntax in request body (400 Bad Request).
      headers:
        x-typesafe-request-id:
          $ref: '#/components/headers/XTypesafeRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: "bad_json"
              message: "invalid JSON: expected value at line 1 column 1"

    Unauthorized:
      description: Missing or invalid API key when authentication is enabled (401 Unauthorized).
      headers:
        x-typesafe-request-id:
          $ref: '#/components/headers/XTypesafeRequestId'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: "unauthorized"
              message: "missing or invalid API key"

    NotFound:
      description: Requested model alias is not registered in the engine registry (404 Not Found).
      headers:
        x-typesafe-request-id:
          $ref: '#/components/headers/XTypesafeRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: "unknown_model"
              message: "unknown model: gpt-4"

    UnprocessableEntity:
      description: Request body validation failed according to Jev schema rules (422 Unprocessable Entity).
      headers:
        x-typesafe-request-id:
          $ref: '#/components/headers/XTypesafeRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: "invalid_body"
              message: "at least one question is required"

    RateLimited:
      description: Client exceeded configured rate limits (429 Too Many Requests).
      headers:
        x-typesafe-request-id:
          $ref: '#/components/headers/XTypesafeRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        retry-after-ms:
          $ref: '#/components/headers/RetryAfterMs'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: "rate_limited"
              message: "rate limited; retry after 2500 ms"

    Overloaded:
      description: Engine or server is temporarily overloaded; client should back off and retry (529 Overloaded).
      headers:
        x-typesafe-request-id:
          $ref: '#/components/headers/XTypesafeRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        retry-after-ms:
          $ref: '#/components/headers/RetryAfterMs'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: "overloaded"
              message: "server overloaded; retry after 1500 ms"

    InternalServerError:
      description: Backend or runtime execution failure (500 Internal Server Error).
      headers:
        x-typesafe-request-id:
          $ref: '#/components/headers/XTypesafeRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: "internal_error"
              message: "engine failed to complete evaluation"

  schemas:
    SystemRequest:
      type: object
      required:
        - state
        - model
        - questions
      properties:
        state:
          $ref: '#/components/schemas/State'
        model:
          type: string
          description: Identifier of the target backend engine (e.g. "jev-latest", "mock").
          example: "jev-latest"
        questions:
          type: object
          description: Map of client-chosen question identifiers to question specifications.
          additionalProperties:
            $ref: '#/components/schemas/Question'

    State:
      description: Context or document to evaluate. Polymorphic: string, object, or array.
      oneOf:
        - type: string
          description: Plain text state.
          example: "I was charged twice for order #1042."
        - type: object
          description: Structured JSON object.
          additionalProperties: true
          example:
            ticket_id: 1042
            user: "alice@example.com"
            amount: 49.99
        - type: array
          description: Ordered list of messages or records.
          items: true
          example:
            - role: "user"
              content: "Help!"
            - role: "assistant"
              content: "How can I help?"

    Question:
      description: Tagged union of question definitions discriminated by `type`.
      discriminator:
        propertyName: type
        mapping:
          noul: '#/components/schemas/NoulQuestion'
          choice: '#/components/schemas/ChoiceQuestion'
          score: '#/components/schemas/ScoreQuestion'
      oneOf:
        - $ref: '#/components/schemas/NoulQuestion'
        - $ref: '#/components/schemas/ChoiceQuestion'
        - $ref: '#/components/schemas/ScoreQuestion'

    NoulQuestion:
      type: object
      required:
        - type
        - instructions
      properties:
        type:
          type: string
          enum: [noul]
          description: Yes/no probability question.
        instructions:
          description: Question text or structured instructions.
        criteria:
          $ref: '#/components/schemas/NoulCriteria'

    NoulCriteria:
      type: object
      required:
        - "true"
        - "false"
      properties:
        "true":
          type: string
          description: Explicit rubric description of what true/yes represents.
        "false":
          type: string
          description: Explicit rubric description of what false/no represents.

    ChoiceQuestion:
      type: object
      required:
        - type
        - instructions
        - criteria
      properties:
        type:
          type: string
          enum: [choice]
          description: Categorical choice question over discrete options.
        instructions:
          description: Question text or structured instructions.
        criteria:
          type: object
          description: Map of option keys to rubric descriptions. Values may be null.
          additionalProperties:
            type:
              - string
              - "null"
          example:
            low: null
            medium: "Standard operational spike"
            high: "Degraded performance"

    ScoreQuestion:
      type: object
      required:
        - type
        - instructions
        - criteria
      properties:
        type:
          type: string
          enum: [score]
          description: Continuous rating evaluation along an ordered rubric.
        instructions:
          description: Question text or structured instructions.
        criteria:
          type: array
          minItems: 2
          description: Ordered array of rubric level descriptions (minimum 2).
          items:
            type: string
          example:
            - "Dissatisfied"
            - "Neutral"
            - "Delighted"

    SystemResponse:
      type: object
      required:
        - model
        - answers
        - usage
      properties:
        model:
          type: string
          description: The model that executed the evaluation.
          example: "mock"
        answers:
          type: object
          description: Map of question identifiers to typed evaluation answers.
          additionalProperties:
            $ref: '#/components/schemas/Answer'
        usage:
          $ref: '#/components/schemas/Usage'

    Answer:
      description: Tagged union of answers discriminated by `type`.
      discriminator:
        propertyName: type
        mapping:
          noul: '#/components/schemas/NoulAnswer'
          choice: '#/components/schemas/ChoiceAnswer'
          score: '#/components/schemas/ScoreAnswer'
      oneOf:
        - $ref: '#/components/schemas/NoulAnswer'
        - $ref: '#/components/schemas/ChoiceAnswer'
        - $ref: '#/components/schemas/ScoreAnswer'

    NoulAnswer:
      type: object
      required:
        - type
        - noul
      properties:
        type:
          type: string
          enum: [noul]
        noul:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: Calibrated probability that the answer is true. Note that Noul answers do NOT have a confidence field.
          example: 0.92

    ChoiceAnswer:
      type: object
      required:
        - type
        - choice
        - probabilities
        - confidence
      properties:
        type:
          type: string
          enum: [choice]
        choice:
          type: string
          description: Selected option identifier.
          example: "high"
        probabilities:
          type: object
          description: Probability distribution over all criteria options summing to 1.0.
          additionalProperties:
            type: number
            format: double
          example:
            low: 0.05
            medium: 0.15
            high: 0.80
        confidence:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: Model confidence in the chosen option.
          example: 0.85

    ScoreAnswer:
      type: object
      required:
        - type
        - score
        - legend
        - probabilities
        - confidence
      properties:
        type:
          type: string
          enum: [score]
        score:
          type: number
          format: double
          description: Rating score along ordered rubric, equal to sum(index * probability[index]).
          example: 1.75
        legend:
          type: object
          description: Map of string indices ("0", "1", ...) to level descriptions.
          additionalProperties:
            type: string
          example:
            "0": "Dissatisfied"
            "1": "Neutral"
            "2": "Delighted"
        probabilities:
          type: object
          description: Probability distribution over rubric levels summing to 1.0.
          additionalProperties:
            type: number
            format: double
          example:
            "0": 0.05
            "1": 0.15
            "2": 0.80
        confidence:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: Model confidence in the score distribution.
          example: 0.88

    Usage:
      type: object
      required:
        - input_tokens
        - output_tokens
      properties:
        input_tokens:
          type: integer
          minimum: 0
          description: Tokens consumed by state and question instructions.
          example: 42
        output_tokens:
          type: integer
          minimum: 0
          description: Tokens produced during inference.
          example: 12

    ListModelsResponse:
      type: object
      required:
        - models
      properties:
        models:
          type: array
          description: List of available model metadata sorted alphabetically by name.
          items:
            $ref: '#/components/schemas/ModelMetadata'

    ModelMetadata:
      type: object
      required:
        - name
        - description
        - release_date
      properties:
        name:
          type: string
          description: Model identifier or alias.
          example: "jev-latest"
        description:
          type: string
          description: Human-readable description of model capabilities.
          example: "Default production System 1 model"
        release_date:
          type: string
          description: Release timestamp or ISO date.
          example: "2026-01-15"

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetails'

    ErrorDetails:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: "invalid_body"
        message:
          type: string
          description: Human-readable error description.
          example: "at least one question is required"
