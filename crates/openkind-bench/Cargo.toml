[package]
name = "openkind-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Offline scoring and timing benchmark harness for openkind engines."

[dependencies]
openkind-core = { workspace = true }
openkind-engine = { workspace = true }
openkind-backends = { workspace = true }
openkind-runtime = { workspace = true }
openkind-datasets = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
rand = "0.9"

[[bin]]
name = "openkind-bench"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
arrow-array = { workspace = true }
arrow-buffer = { version = "=60.0.0" }
arrow-schema = { workspace = true }
parquet = { workspace = true }

[features]
# MLX engine dispatch for the `score` subcommand (macOS arm64). Mirrors the
# `openkind-backends` feature: build with
# `SDKROOT=$(xcrun --show-sdk-path) cargo ... --features mlx`.
mlx = ["openkind-backends/mlx"]
# CUDA execution for the native scoring probes.
cuda = ["openkind-backends/cuda"]
# ONNX artifact execution (see docs/ONNX.md).
onnx = ["openkind-backends/onnx"]
onnx-cuda = ["openkind-backends/onnx-cuda"]
onnx-rocm = ["openkind-backends/onnx-rocm"]
