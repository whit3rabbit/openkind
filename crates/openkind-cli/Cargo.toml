[package]
name = "openkind-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Phase 1: `openkind` command-line tool — serve, evaluate, inspect, version."

[dependencies]
openkind-core = { workspace = true }
openkind-client = { workspace = true }
openkind-engine = { workspace = true }
openkind-model-store = { workspace = true }
clap = { workspace = true }
smallvec = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4"
# Faster JSON parse for the inspect/evaluate request path; serde_json
# remains the fallback and the authority on parse-error messages.
sonic-rs = { workspace = true }
anyhow = { workspace = true }
ring = "0.17"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }
tracing = { workspace = true }
indicatif = "0.18.6"
bubbletea-rs = { version = "0.0.9", default-features = false, features = ["tokio-runtime"] }
crossterm = "0.29"
lipgloss = "0.1.1"
unicode-width = "0.2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { workspace = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "openkind"
path = "src/main.rs"

[[bench]]
name = "cli"
harness = false
