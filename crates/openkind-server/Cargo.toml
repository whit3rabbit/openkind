[package]
name = "openkind-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Phase 1: openkindd — the daemon combining HTTP, gRPC, config, tracing, and graceful shutdown."

[dependencies]
openkind-core = { workspace = true }
openkind-engine = { workspace = true }
openkind-api = { workspace = true }
openkind-backends = { workspace = true }
openkind-runtime = { workspace = true }
axum = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
humantime-serde = { workspace = true }

[features]
mlx = ["openkind-backends/mlx"]

[dev-dependencies]
criterion = { workspace = true }

[[bin]]
name = "openkindd"
path = "src/main.rs"

[[bench]]
name = "server"
harness = false
