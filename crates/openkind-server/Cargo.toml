[package]
name = "openkind-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Phase 1: openkindd — the daemon combining HTTP, gRPC, config, tracing, and graceful shutdown."

[dependencies]
openkind-core = { workspace = true }
openkind-engine = { workspace = true }
openkind-api = { workspace = true }
openkind-backends = { workspace = true }
openkind-model-store = { workspace = true }
openkind-runtime = { workspace = true }
axum = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
humantime-serde = { workspace = true }
openkind-client = { version = "0.1.0", path = "../openkind-client" }
sha2.workspace = true

[features]
mlx = ["openkind-backends/mlx"]
# CUDA execution for the native backbone and every candle-backed family.
cuda = ["openkind-backends/cuda"]
# ONNX artifact execution through ONNX Runtime (see docs/ONNX.md).
onnx = ["openkind-backends/onnx"]
# ONNX sessions may register the CUDA execution provider.
onnx-cuda = ["onnx", "openkind-backends/onnx-cuda"]
# ONNX sessions may register the AMD ROCm execution provider (Linux only).
onnx-rocm = ["onnx", "openkind-backends/onnx-rocm"]

[dev-dependencies]
candle-core = { workspace = true }
criterion = { workspace = true }
openkind-client = { path = "../openkind-client" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tempfile = "3"

[[bin]]
name = "openkindd"
path = "src/main.rs"

[[test]]
name = "proxy_cache_e2e"
harness = false

[[test]]
name = "proxy_key_precedence"
harness = false

[[bench]]
name = "server"
harness = false
