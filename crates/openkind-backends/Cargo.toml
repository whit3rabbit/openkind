[package]
name = "openkind-backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native model backends and parity-checked decision readouts for OpenKind."

[dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
# f16 block scales for the GGUF q8_0 row reader (matches candle's convert).
half = { workspace = true }
openkind-core = { workspace = true }
openkind-engine = { workspace = true }
openkind-runtime = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokenizers = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
fastrand = { workspace = true }
ndarray = "0.16"
rusqlite = { version = "0.37", features = ["bundled"] }

# ONNX Runtime execution of exported family artifacts (Phase 3N). Optional so
# the default workspace battery never requires the ONNX Runtime library;
# `load-dynamic` keeps the build offline and defers the dylib to operator
# setup. See docs/ONNX.md.
ort = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
memmap2 = { version = "0.9", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["accelerate"] }
candle-nn = { workspace = true, features = ["accelerate"] }

# MLX/Metal parity backend (Phase 3M). Optional so the default workspace
# battery never requires the Metal toolchain; enable with --features mlx on
# macOS arm64 (set SDKROOT to the macOS SDK for bindgen).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = { workspace = true, optional = true }
mlx-sys = { workspace = true, optional = true }
half = { workspace = true, optional = true }

[features]
mlx = ["dep:mlx-rs", "dep:mlx-sys", "dep:half"]
# Native candle CUDA execution for every candle-backed family and the Qwen3.5
# backbone. Requires the CUDA toolchain (nvcc) at build time; no workspace
# default enables it. See docs/CUDA.md.
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]
# ONNX artifact execution through ONNX Runtime (CPU execution provider by
# default). See docs/ONNX.md.
onnx = ["dep:ort", "dep:prost", "dep:memmap2"]
# Allow ONNX sessions to register the CUDA execution provider. Requires an
# ONNX Runtime build with CUDA support; loading fails closed otherwise.
onnx-cuda = ["onnx", "ort/cuda"]

[lib]
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.27.0"
