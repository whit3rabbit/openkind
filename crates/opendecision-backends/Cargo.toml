[package]
name = "opendecision-backends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native model backends and parity-checked decision readouts for OpenDecision."

[dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
opendecision-core = { workspace = true }
opendecision-engine = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokenizers = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["accelerate"] }
candle-nn = { workspace = true, features = ["accelerate"] }

[lib]
path = "src/lib.rs"
