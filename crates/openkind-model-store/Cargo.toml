[package]
name = "openkind-model-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Curated, verified local model installations for OpenKind"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tokio = { workspace = true, features = ["io-util"] }
futures = { workspace = true }
fs2 = "0.4"

# O_NOFOLLOW hardening on partial-file opens.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = "3"
